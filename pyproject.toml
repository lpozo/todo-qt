[project]
name = "todo-qt"
version = "0.1.0"
requires-python = ">=3.14"
description = "A desktop to-do list application built with Qt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyside6-essentials>=6.12,<7"]

[project.scripts]
todo-qt = "todo_qt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-qt>=4.5",
  "pytest-xdist>=3",
  "hypothesis>=6",
  "pre-commit>=3.7",
  "import-linter>=2",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_unimported = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85  # Enforced by pytest-cov in CI and /verify; adjust per project

[tool.importlinter]
root_packages = ["todo_qt"]
include_external_packages = true  # required to forbid third-party imports

[[tool.importlinter.contracts]]
name = "Layers: cli, then ui and persistence, then services, then domain"
type = "layers"
layers = [
  "todo_qt.cli",
  "todo_qt.ui | todo_qt.persistence",
  "todo_qt.services",
  "todo_qt.domain",
]

[[tool.importlinter.contracts]]
name = "Qt is imported only in ui"
type = "forbidden"
source_modules = [
  "todo_qt.domain",
  "todo_qt.services",
  "todo_qt.persistence",
]
forbidden_modules = ["PySide6", "shiboken6", "PyQt6", "PyQt5", "PySide2"]

# cli imports todo_qt.ui (lazily) to launch the window, so cli -> ui -> PySide6 is expected;
# this contract still rejects a direct Qt import in cli.
[[tool.importlinter.contracts]]
name = "cli imports Qt only through ui"
type = "forbidden"
source_modules = ["todo_qt.cli"]
forbidden_modules = ["PySide6", "shiboken6", "PyQt6", "PyQt5", "PySide2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain does no I/O"
type = "forbidden"
source_modules = ["todo_qt.domain"]
forbidden_modules = [
  "json", "sqlite3", "os", "pathlib", "shutil", "tempfile", "uuid", "socket", "urllib", "http",
]

[[tool.importlinter.contracts]]
name = "Services do no file or network I/O"
type = "forbidden"
source_modules = ["todo_qt.services"]
forbidden_modules = ["json", "sqlite3", "os", "shutil", "tempfile", "uuid", "socket", "urllib", "http"]

[[tool.importlinter.contracts]]
name = "UI controller and messages stay Qt-free"
type = "forbidden"
source_modules = ["todo_qt.ui.controller", "todo_qt.ui.messages"]
forbidden_modules = ["PySide6", "shiboken6", "PyQt6", "PyQt5", "PySide2"]

[[tool.importlinter.contracts]]
name = "No network anywhere"
type = "forbidden"
source_modules = ["todo_qt"]
forbidden_modules = [
  "socket", "ssl", "urllib", "http", "ftplib", "smtplib", "requests", "httpx", "aiohttp",
]
